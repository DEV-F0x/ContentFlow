name: Build and Push ContentFlow Docker Images to GHCR

on:
  release:
    types: [created]

env:
  GHCR_REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        service: [api, dashboard]
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
        include:
          - service: api
            image_name: contentflow-api
            context: .
            file: services/api/Dockerfile
          - service: dashboard
            image_name: contentflow-dashboard
            context: .
            file: services/dashboard/Dockerfile
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm     # native ARM, no emulation
          - platform: linux/arm/v7
            runner: ubuntu-24.04-arm     # emulate v7 on real ARM = much faster
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prep platform pair
        run: |
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${image_name}" >> $GITHUB_ENV
        env:
          platform: ${{ matrix.platform }}
          image_name: ${{ matrix.image_name }}

      - uses: actions/checkout@v5

      - name: Minify JS and CSS
        if: matrix.service == 'dashboard'
        run: |
          npm install -g terser clean-css-cli
          for f in services/dashboard/**/static/js/*.js; do [ -f "$f" ] && terser "$f" -o "$f" --compress --mangle; done
          for f in services/dashboard/**/static/css/*.css; do [ -f "$f" ] && cleancss -o "$f" "$f"; done
        shell: bash

      - uses: docker/setup-qemu-action@v4
        if: matrix.platform == 'linux/arm/v7'

      - uses: docker/setup-buildx-action@v4

      # Dockerfiles FROM dhi.io/python:* (Docker Hardened Images) -- pulling
      # those base images requires a Docker Hub account authenticated
      # against the dhi.io registry, even for the free Community tier.
      - uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DHI_TOKEN }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ env.PLATFORM_PAIR }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.service }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [api, dashboard]
        include:
          - service: api
            image_name: contentflow-api
          - service: dashboard
            image_name: contentflow-dashboard
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set image env
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image_name }}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
