name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, dashboard]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r services/${{ matrix.service }}/requirements-test.txt

      - name: Run tests
        run: python -m pytest services/${{ matrix.service }}/tests -v
