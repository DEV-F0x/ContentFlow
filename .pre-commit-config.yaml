  # # Code-Metrics
  # - repo: local
  #   hooks:
  #     - id: radon-complexity
  #       name: Radon Complexity Check
  #       entry: radon cc -s -a {files}
  #       language: python
  #       additional_dependencies: [radon]
  #       types: [python]

  # Import Sorting
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: [--profile=black]

  # Flags leftover debug print() calls in Python code — use `logging`
  # instead (see app/core/logging.py).
  - repo: local
    hooks:
      - id: check-print-statements
        name: Check for print() statements
        entry: python3 .pre-commit/check_print_statements.py
        language: system
        files: \.py$
        exclude: ^.pre-commit/